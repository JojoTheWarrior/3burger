<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3BURGER - Unlimited $3 Harvey's Burgers</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
<div id="navbar">
    <header id="burger-title">3<span>BURGER</span></header>
    <h1 id="slogan"><span class="gradient-text">Unlimited</span> $3 Harvey's Burgers</h1>
</div>

<main>
    <form id="orderForm">
        <label for="address">Delivery Address</label>
        <input type="text" id="address" name="address" placeholder="170 University Avenue West">

        <label class="section-title">Toppings</label>
        <div id="toppings" class="customizations">
            <label><input type="checkbox" value="Shredded Lettuce"><span>Shredded Lettuce</span></label>
            <label><input type="checkbox" value="Onions"><span>Onions</span></label>
            <label><input type="checkbox" value="Tomatoes"><span>Tomatoes</span></label>
            <label><input type="checkbox" value="Pickles"><span>Pickles</span></label>
            <label><input type="checkbox" value="Relish"><span>Relish</span></label>
            <label><input type="checkbox" value="Hot Peppers"><span>Hot Peppers</span></label>
            <label><input type="checkbox" value="Jalapeños"><span>Jalapeños</span></label>
            <label><input type="checkbox" value="Black Olives"><span>Black Olives</span></label>
            <label><input type="checkbox" value="Cucumbers"><span>Cucumbers</span></label>
            <label><input type="checkbox" value="Salt & Pepper"><span>Salt & Pepper</span></label>
        </div>

        <label class="section-title">Sauces</label>
        <div id="sauces" class="customizations">
            <label><input type="checkbox" value="Ketchup"><span>Ketchup</span></label>
            <label><input type="checkbox" value="Mustard"><span>Mustard</span></label>
            <label><input type="checkbox" value="Mayo"><span>Mayo</span></label>
            <label><input type="checkbox" value="BBQ Sauce"><span>BBQ Sauce</span></label>
            <label><input type="checkbox" value="Ghost Pepper Mayo"><span>Ghost Pepper Mayo</span></label>
            <label><input type="checkbox" value="Chipotle"><span>Chipotle</span></label>
            <label><input type="checkbox" value="Harv Sauce"><span>Harv Sauce</span></label>
            <label><input type="checkbox" value="Hot Sauce"><span>Hot Sauce</span></label>
            <label><input type="checkbox" value="Garlic Mayo"><span>Garlic Mayo</span></label>
            <label><input type="checkbox" value="Ranch"><span>Ranch</span></label>
        </div>



        <label for="orderTime">Order Time</label>
        <select id="orderTime" name="orderTime">
            <option value="now">NOW</option>
            <option value="later">LATER</option>
        </select>

        <div class="time-later" id="laterTimeDiv">
            <label for="laterTime">Select Time (HH:MM)</label>
            <select id="laterTime" name="laterTime"></select>
        </div>

        <label for="pickup-name">Pickup Name</label>
        <input type="text" id="pickup-name" name="pickup-name" placeholder="John Doe">

        <div class="credit-card-section">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="John Doe">

            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456">

            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" placeholder="123">

            <label for="expiryDate">Expiry Date (MM/YY)</label>
            <input type="text" id="expiryDate" name="expiryDate" placeholder="08/25">

            <label for="postalCode">Postal Code</label>
            <input type="text" id="postalCode" name="postalCode" placeholder="A1B 2C3">
        </div>

        <button type="submit">Place Order</button>
    </form>
    <!--bouquet layer-->
    <div id="bouquet-layer"></div>
</main>

<div id="orderPlaced" style="display:none;">
    <div>Your burger is being prepared!</div>
    <div id="progressBarContainer">
        <div id="progressBar"></div>
    </div>
</div>

<!-- external js -->
<script type="module" src="./index.js"></script>
</body>
</html>
