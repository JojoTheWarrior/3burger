<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3BURGER - Unlimited $3 Harvey's Burgers</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
<div id="navbar">
    <header id="burger-title">3<span>BURGER</span></header>
    <h1 id="slogan"><span class="gradient-text">Unlimited</span> $3 Harvey's Burgers</h1>
</div>

<main>
    <form id="orderForm">
        <label for="address">Delivery Address</label>
        <input type="text" id="address" name="address" placeholder="170 University Avenue West">

        <label for="toppings">Toppings</label>
        <select id="toppings" name="toppings" multiple size="10">
            <option value="Shredded Lettuce">Shredded Lettuce</option>
            <option value="Onions">Onions</option>
            <option value="Tomatoes">Tomatoes</option>
            <option value="Pickles">Pickles</option>
            <option value="Relish">Relish</option>
            <option value="Hot Peppers">Hot Peppers</option>
            <option value="Jalapeños">Jalapeños</option>
            <option value="Black Olives">Black Olives</option>
            <option value="Cucumbers">Cucumbers</option>
            <option value="Salt & Pepper">Salt & Pepper</option>
        </select>

        <label for="sauces">Sauces</label>
        <select id="sauces" name="sauces" multiple size="10">
            <option value="Ketchup">Ketchup</option>
            <option value="Mustard">Mustard</option>
            <option value="Mayo">Mayo</option>
            <option value="BBQ Sauce">BBQ Sauce</option>
            <option value="Ghost Pepper Mayo">Ghost Pepper Mayo</option>
            <option value="Chipotle">Chipotle</option>
            <option value="Harv Sauce">Harv Sauce</option>
            <option value="Hot Sauce">Hot Sauce</option>
            <option value="Garlic Mayo">Garlic Mayo</option>
            <option value="Ranch">Ranch</option>
        </select>

        <label for="orderTime">Order Time</label>
        <select id="orderTime" name="orderTime">
            <option value="now">NOW</option>
            <option value="later">LATER</option>
        </select>

        <div class="time-later" id="laterTimeDiv">
            <label for="laterTime">Select Time (HH:MM)</label>
            <select id="laterTime" name="laterTime"></select>
        </div>

        <label for="pickup-name">Pickup Name</label>
        <input type="text" id="pickup-name" name="pickup-name" placeholder="John Doe">

        <div class="credit-card-section">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="John Doe">

            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456">

            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" placeholder="123">

            <label for="expiryDate">Expiry Date (MM/YY)</label>
            <input type="text" id="expiryDate" name="expiryDate" placeholder="08/25">

            <label for="postalCode">Postal Code</label>
            <input type="text" id="postalCode" name="postalCode" placeholder="A1B 2C3">
        </div>

        <button type="submit">Place Order</button>
    </form>
    <!--bouquet layer-->
    <div id="bouquet-layer"></div>
</main>

<div id="orderPlaced" style="display:none;">
    <div>Your burger is being prepared!</div>
    <div id="progressBarContainer">
        <div id="progressBar"></div>
    </div>
</div>

<!-- external js -->
<script type="module" src="./index.js"></script>
</body>
</html>
